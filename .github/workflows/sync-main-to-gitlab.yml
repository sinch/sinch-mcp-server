name: Sync main to GitLab

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: sync-main-to-gitlab
  cancel-in-progress: false

jobs:
  trigger-gitlab-pull:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Trigger GitLab pull mirror
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_API_TOKEN}" ] || [ -z "${GITLAB_PROJECT_ID}" ]; then
            echo "Missing GITLAB_API_TOKEN and/or GITLAB_PROJECT_ID secrets" >&2
            exit 1
          fi

          api="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/mirror/pull"

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITLAB_API_TOKEN}" \
            "$api"
