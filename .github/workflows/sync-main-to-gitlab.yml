name: Sync main to GitLab

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: sync-main-to-gitlab
  cancel-in-progress: false

jobs:
  sync:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to GitLab
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_PUSH_TOKEN}" ] || [ -z "${GITLAB_REPO_URL}" ]; then
            echo "Missing GITLAB_PUSH_TOKEN and/or GITLAB_REPO_URL secrets" >&2
            exit 1
          fi
          git remote add gitlab "https://oauth2:${GITLAB_PUSH_TOKEN}@${GITLAB_REPO_URL}"
          git fetch gitlab main
          git push gitlab HEAD:main --force-with-lease
