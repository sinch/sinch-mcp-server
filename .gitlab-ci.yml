include:
  - project: '$SINCH_SECURITY_PIPELINE_PROJECT'
    ref: v1-latest
    file: 'auto_security.yml'
    
default:
  tags: [default]
  
variables:
  SINCH_GLOBAL_SECURITY_STAGE_SAST_DEEP_CLONE: "true"
  SECURITY_STEPS_FORCE_RUN: "true"
  
stages:
  - test-coverage
  - security-scan-third-parties
  - security-scan-consolidation
  - security-scan-sonar

# Produces coverage/lcov.info for the security-scan-sonar stage, which picks it up
# as an artifact from this earlier stage (see sonar.javascript.lcov.reportPaths).
unit-tests-coverage:
  stage: test-coverage
  image: node:20
  script:
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/lcov.info
