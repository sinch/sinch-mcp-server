include:
  - project: '$SINCH_SECURITY_PIPELINE_PROJECT'
    ref: v1-latest
    file: 'auto_security.yml'
  - component: gitlab.com/sinch/sinch-projects/sinch-platform/infra/pipeline/deploy-helm-gka/deploy-helm-gka@4.9.0
    inputs:
      deploymentName: sinch-mcp-server
      autoDeployOnDefaultBranch: true
      helmChart: helm
      helmConfigPath: helm/config
      namespaceName: mcp-messaging
      dependencies: [publish-image]
      stageForStaging: deploy
      stageForProduction: deploy
      enableHelmRepoNexus: false
      eu1tst-eks001: true
      us1tst-eks001: true
      us1-eks001: false
      eu1-eks001: false
      br1-eks001: false

default:
  tags: [default]

variables:
  SINCH_GLOBAL_SECURITY_STAGE_SAST_DEEP_CLONE: 'true'
  SECURITY_STEPS_FORCE_RUN: 'true'
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

stages:
  - test-coverage
  - publish
  - deploy
  - security-scan-third-parties
  - security-scan-consolidation
  - security-scan-sonar

# Produces coverage/lcov.info for the security-scan-sonar stage, which picks it up
# as an artifact from this earlier stage (see sonar.javascript.lcov.reportPaths).
unit-tests-coverage:
  stage: test-coverage
  image: node:20
  script:
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/lcov.info

publish-image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - |
      set -euo pipefail
      IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      DEST="${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
      echo "Building ${DEST}"
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${DEST}" \
        --destination "${CI_REGISTRY_IMAGE}:latest" \
        --build-arg "BUILDKIT_INLINE_CACHE=1"
      echo "ARTIFACT_VERSION=${IMAGE_TAG}" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
