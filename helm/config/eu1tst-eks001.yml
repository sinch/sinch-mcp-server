# Staging EU — 2 replicas for PDB / rolling updates.
# Session state is shared via Redis (REDIS_URL), so requests can land on either pod.

replicaCount: 2

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

existingSecret: sinch-mcp-server
