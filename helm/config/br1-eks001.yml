# Production BR — single replica while MCP sessions remain in-memory per pod.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podDisruptionBudget:
  enabled: false

existingSecret: sinch-mcp-server
