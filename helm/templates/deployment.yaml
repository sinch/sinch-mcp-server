{{- $authMode := required "authMode is required (client-credentials | sinchid-agent)." .Values.authMode -}}
{{- if not (has $authMode (list "client-credentials" "sinchid-agent")) -}}
{{- fail "authMode must be one of: client-credentials, sinchid-agent." -}}
{{- end -}}
{{- $conversationRegion := required "conversationRegion is required (us | eu | br)." .Values.conversationRegion -}}
{{- if not (has $conversationRegion (list "us" "eu" "br")) -}}
{{- fail "conversationRegion must be one of: us, eu, br." -}}
{{- end -}}
{{- if eq $authMode "sinchid-agent" -}}
{{- if not .Values.googleServiceAccount.existingSecret -}}
{{- fail "googleServiceAccount.existingSecret is required when authMode is sinchid-agent." -}}
{{- end -}}
{{- if not .Values.googleServiceAccount.key -}}
{{- fail "googleServiceAccount.key is required when authMode is sinchid-agent." -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" .Values.googleServiceAccount.key) -}}
{{- fail "googleServiceAccount.key must be a single valid Kubernetes Secret data key." -}}
{{- end -}}
{{- if not (hasPrefix "/" .Values.googleServiceAccount.mountDirectory) -}}
{{- fail "googleServiceAccount.mountDirectory must be an absolute path when authMode is sinchid-agent." -}}
{{- end -}}
{{- else if .Values.googleServiceAccount.existingSecret -}}
{{- fail "googleServiceAccount may only be configured when authMode is sinchid-agent." -}}
{{- end -}}
{{- $googleCredentialsPath := printf "%s/%s" (trimSuffix "/" .Values.googleServiceAccount.mountDirectory) .Values.googleServiceAccount.key -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sinch-mcp-server.fullname" . }}
  labels:
    {{- include "sinch-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sinch-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sinch-mcp-server.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.version | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            # Required, not optional: this chart only ever deploys the remote multi-tenant
            # server, which refuses to start without a region. Failing at template time gives
            # a clear error instead of a crash-looping pod.
            - name: CONVERSATION_REGION
              value: {{ $conversationRegion | quote }}
            # Required, not optional: the server refuses to start without it, and a
            # deployment without a pinned auth mode would accept every shape on an
            # edge-unauthenticated endpoint.
            - name: MCP_AUTH_MODE
              value: {{ $authMode | quote }}
            {{- if eq $authMode "sinchid-agent" }}
            # Required, not optional, on this auth mode: the server verifies the inbound SinchID
            # token against this JWKS (signature, issuer, audience, expiry) before trusting any
            # claim from it, and refuses to start without all three.
            - name: SINCHID_JWT_ISSUER
              value: {{ required "sinchidJwtIssuer is required when authMode is sinchid-agent." .Values.sinchidJwtIssuer | quote }}
            - name: SINCHID_JWT_AUDIENCE
              value: {{ required "sinchidJwtAudience is required when authMode is sinchid-agent." .Values.sinchidJwtAudience | quote }}
            - name: SINCHID_JWT_JWKS_URI
              value: {{ required "sinchidJwtJwksUri is required when authMode is sinchid-agent." .Values.sinchidJwtJwksUri | quote }}
            # Google client libraries use this mounted service-account key as Application
            # Default Credentials when fetching this installation's latest secret version.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ $googleCredentialsPath | quote }}
            {{- end }}
            {{- if .Values.toolTags }}
            - name: MCP_TAGS
              value: {{ .Values.toolTags | quote }}
            {{- end }}
            # Required, not optional: the server refuses to start without Redis for shared
            # session storage. Keys must match the connection secret exactly (e.g. a
            # Crossplane-provisioned ElastiCache connection secret): endpoint, port, password.
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ required "redisConnectionSecret is required — the server needs Redis for shared session storage and refuses to start without it." .Values.redisConnectionSecret }}
                  key: endpoint
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redisConnectionSecret }}
                  key: port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redisConnectionSecret }}
                  key: password
            {{- if .Values.existingSecret }}
            {{- range .Values.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $authMode "sinchid-agent" }}
            - name: google-service-account
              mountPath: {{ .Values.googleServiceAccount.mountDirectory | quote }}
              readOnly: true
            {{- end }}
          {{- if .Values.lifecycle.preStop.sleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.lifecycle.preStop.sleepSeconds }}"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $authMode "sinchid-agent" }}
        - name: google-service-account
          secret:
            secretName: {{ .Values.googleServiceAccount.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.googleServiceAccount.key | quote }}
                path: {{ .Values.googleServiceAccount.key | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
