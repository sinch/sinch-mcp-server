replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: registry.gitlab.com/sinch/sinch-projects/product/agent-experience/sinch-mcp-server
  # Default matches Chart.appVersion; CI/GKA overrides via ARTIFACT_VERSION.
  version: "0.0.1-alpha.6"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

costGovernance:
  cg_product: agent_tools
  cg_product2: mcp
  cg_system: agent_tools
  cg_product_id: "0"
  cg_team: ax
  cg_business_unit: enterprise_messaging
  cg_release_state: alpha

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Existing K8s Secret with MCP_API_KEY, REDIS_URL, and Sinch/Mailgun credentials.
# Create manually or via ExternalSecrets before first deploy.
existingSecret: sinch-mcp-server

env:
  - name: PORT
    value: "8000"
  - name: NODE_ENV
    value: production
  - name: LOG_LEVEL
    value: info
  - name: SHUTDOWN_DRAIN_MS
    value: "10000"

# Keys loaded from existingSecret into the container env.
secretKeys:
  - MCP_API_KEY
  - REDIS_URL
  - PROJECT_ID
  - KEY_ID
  - KEY_SECRET
  - CONVERSATION_REGION
  - APPLICATION_KEY
  - APPLICATION_SECRET
  - MAILGUN_DOMAIN
  - MAILGUN_API_KEY
  - MAILGUN_SENDER_ADDRESS

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

lifecycle:
  preStop:
    sleepSeconds: 15

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 45

nodeSelector: {}
tolerations: []
affinity: {}
