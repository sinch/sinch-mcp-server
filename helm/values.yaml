replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: registry.gitlab.com/sinch/sinch-projects/product/agent-experience/sinch-mcp-server
  # Fallback for local `helm template` / `helm install` only. In every deployed
  # environment this is overridden by the HelmRelease in k8s-manifests-mcp-messaging,
  # which the `update-manifests` CI job bumps to the freshly built image tag.
  version: "0.0.1-alpha.6"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

costGovernance:
  cg_product: agent_tools
  cg_product2: mcp
  cg_system: agent_tools
  cg_product_id: "0"
  cg_team: ax
  cg_business_unit: enterprise_messaging
  cg_release_state: alpha

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Credentials are deliberately empty: every caller brings its own.
# Do NOT populate PROJECT_ID / KEY_ID / KEY_SECRET here. This chart always sets authMode, so
# the server runs multi-tenant and never reads them — they would be inert, but they would
# still be live Sinch credentials sitting in the namespace with nothing to read them.
# Leaving existingSecret empty means the chart mounts no secret at all.
existingSecret: ""
secretKeys: []

# Optional Secret containing environment variables to inject via envFrom (e.g. tenant M2M credentials
# formatted as SINCH_AGENT_M2M_<orderId>_<projectId>). Defaults to empty string (no envFrom block).
extraEnvFromSecret: ""

# Conversation API region — one of: us | eu | br. REQUIRED; there is no default.
# Set per site in k8s-manifests-mcp-messaging.
conversationRegion: ""

# The one inbound auth shape this deployment accepts (MCP_AUTH_MODE) — one of:
#   client-credentials  Bearer <base64 projectId:keyId:keySecret>, the caller's own
#   sinchid-agent       Bearer <SinchID access token>, plus an x-agent-id header
# Both are multi-tenant. Single-tenant is not a value here — it is what the server falls to
# when MCP_AUTH_MODE is UNSET, and it performs no inbound authentication at all, so it must
# never be deployed. Setting this value is what keeps that unreachable through the chart.
# REQUIRED; there is no default. Both endpoints are unauthenticated at the edge, so a
# deployment that accepted every shape would defeat the point of splitting them.
authMode: ""

# SinchID JWT verification — REQUIRED when authMode is "sinchid-agent", ignored otherwise. The
# server verifies the inbound Authorization token's signature against this JWKS (algorithm pinned
# to RS256), plus its issuer and audience, before trusting any claim from it. There is no default.
sinchidJwtIssuer: ""
sinchidJwtAudience: ""
sinchidJwtJwksUri: ""

# Name of the Secret holding the Redis connection details for shared session storage.
# REQUIRED — the server refuses to start without Redis. This is deliberately separate from
# existingSecret/secretKeys above: it's typically infra-managed (e.g. a Crossplane-provisioned
# AWS ElastiCache connection secret), not an application credential we own.
# Must contain the keys: endpoint, port, password.
redisConnectionSecret: ""

# Allow-list of tool tags to register (MCP_TAGS). Only tools whose credentials can be
# supplied per request belong on a multi-tenant deployment.
# Empty string = no filter = all tools (correct for local/stdio use, wrong for remote).
toolTags: "conversation,numbers"

env:
  - name: PORT
    value: "8000"
  - name: NODE_ENV
    value: production
  - name: LOG_LEVEL
    value: info
  - name: SHUTDOWN_DRAIN_MS
    value: "10000"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

lifecycle:
  preStop:
    sleepSeconds: 15

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 45

nodeSelector: {}
tolerations: []
affinity: {}
